plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

ext {
    minecraftVersion = '1.19.4'
    javaVersion = 17
    fabricApiVersion = '0.87.2+1.19.4'
    minecraftRange = '>=1.19.4 <1.20'
    javaRange = '17'
    keybindBackend = 'binding'
    inputBackend = 'long'
    cameraBackend = 'legacy'
    loaderRange = '>=0.15.7'
}

apply from: rootProject.file('gradle/version-module.gradle')
