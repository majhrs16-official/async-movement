plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

ext {
    minecraftVersion = '1.20.4'
    javaVersion = 17
    fabricApiVersion = '0.97.3+1.20.4'
    minecraftRange = '>=1.20.4 <1.20.5'
    javaRange = '17'
    keybindBackend = 'binding'
    inputBackend = 'long'
    cameraBackend = 'legacy'
    loaderRange = '>=0.15.7'
}

apply from: rootProject.file('gradle/version-module.gradle')
