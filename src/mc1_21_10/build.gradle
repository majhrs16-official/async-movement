plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

ext {
    minecraftVersion = '1.21.10'
    javaVersion = 21
    fabricApiVersion = '0.138.4+1.21.10'
    minecraftRange = '>=1.21.10 <1.21.11'
    javaRange = '21'
    keybindBackend = 'binding'
    inputBackend = 'window'
    cameraBackend = 'modern'
    loaderRange = '>=0.16.0'
}

apply from: rootProject.file('gradle/version-module.gradle')
