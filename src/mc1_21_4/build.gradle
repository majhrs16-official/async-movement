plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

ext {
    minecraftVersion = '1.21.4'
    javaVersion = 21
    fabricApiVersion = '0.119.4+1.21.4'
    minecraftRange = '>=1.21.4 <1.21.5'
    javaRange = '21'
    keybindBackend = 'binding'
    inputBackend = 'long'
    cameraBackend = 'modern'
    loaderRange = '>=0.16.0'
}

apply from: rootProject.file('gradle/version-module.gradle')
